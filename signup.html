<!doctype html><html lang="en"><head><title>NewFlix · Sign Up</title><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07090f"><link rel="manifest" href="site.webmanifest"><link rel="icon" href="ico/favicon.svg" type="image/svg+xml"><link rel="alternate icon" href="ico/favicon.png" type="image/png"><link rel="apple-touch-icon" href="ico/favicon.png"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><link rel="stylesheet" href="css/main.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/core.js"></script></head><body><div class="ambient ambient-a"></div><div class="ambient ambient-b"></div><div class="noise"></div><script>document.addEventListener('DOMContentLoaded',()=>document.body.insertAdjacentHTML('afterbegin',navbar('')))</script><main class="auth-shell"><section class="panel auth-panel"><div class="auth-brand"><span class="logo-mark"><i class="fa-solid fa-play"></i></span><h1>Create your profile</h1><p>Build your list, choose an avatar and watch with friends.</p></div><form id="signupForm"><div class="form-group"><label>Name</label><input id="name" class="input" required></div><div class="form-group"><label>Email</label><input id="email" type="email" class="input" required></div><div class="form-group"><label>Password</label><input id="password" type="password" minlength="8" class="input" required></div><button class="btn primary" style="width:100%">Create account</button></form><p class="muted" style="text-align:center;margin-top:18px">Already have an account? <a href="signin.html">Sign in</a></p></section></main><div id="toast" class="toast"></div><script>document.addEventListener('DOMContentLoaded',()=>document.body.insertAdjacentHTML('beforeend',footer()))</script><script src="js/auth.js"></script><script>document.getElementById('signupForm').onsubmit=async e=>{e.preventDefault();const r=await signup(document.getElementById('name').value,document.getElementById('email').value,document.getElementById('password').value);if(!r.success)return toast(r.error);toast('Account created. Check your email if confirmation is enabled.');setTimeout(()=>location.href='settings.html',800)}</script><script src="js/tv.js"></script></body></html>
