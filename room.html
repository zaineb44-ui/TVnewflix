<!doctype html><html lang="en"><head><title>NewFlix · Room</title><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07090f"><link rel="manifest" href="site.webmanifest"><link rel="icon" href="ico/favicon.svg" type="image/svg+xml"><link rel="alternate icon" href="ico/favicon.png" type="image/png"><link rel="apple-touch-icon" href="ico/favicon.png"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><link rel="stylesheet" href="css/main.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/core.js"></script></head><body><div class="ambient ambient-a"></div><div class="ambient ambient-b"></div><div class="noise"></div><script>document.addEventListener('DOMContentLoaded',()=>document.body.insertAdjacentHTML('afterbegin',navbar('rooms')))</script><main class="page" id="roomRoot"><div class="room-layout"><section class="panel"><div class="section-title"><div><span class="eyebrow">Watch room</span><h1 id="roomName">Room</h1><p id="roomMeta" class="muted"></p></div><a id="openPlayer" class="btn primary"><i class="fa-solid fa-play"></i> Open synchronized player</a></div><p id="controllerNote" class="notice">Playback follows the room host.</p><div class="watch-bar"><button id="copyInvite" class="btn"><i class="fa-solid fa-link"></i> Copy invite</button><button id="manageRoom" class="btn" style="display:none"><i class="fa-solid fa-gear"></i> Manage room</button><button id="leaveRoom" class="btn danger">Leave room</button></div><h2>Members</h2><div id="memberList"></div></section><aside class="side-stack"><section class="panel"><h2>Invite</h2><div class="chat-form"><input id="inviteUser" class="input" placeholder="Username"><button id="inviteBtn" class="btn primary">Invite</button></div></section><section class="panel"><h2>Room chat</h2><div id="chatMessages" class="chat-messages"></div><form id="chatForm" class="chat-form"><input id="chatInput" class="input" placeholder="Message the room"><button class="btn primary"><i class="fa-solid fa-paper-plane"></i></button></form></section></aside></div></main><div id="toast" class="toast"></div><script>document.addEventListener('DOMContentLoaded',()=>document.body.insertAdjacentHTML('beforeend',footer()))</script><script src="js/room.js"></script><script src="js/tv.js"></script></body></html>
