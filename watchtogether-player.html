l>Adaptive HLS • Full sync</small><em><i class="fa-solid fa-users-viewfinder"></i> Low-bandwidth sync</em></span><span class="source-state"><i class="fa-solid fa-check"></i></span></button><button class="source-btn source-card source-moviesapi" data-source="moviesapi"><span class="source-orbit"><i class="fa-solid fa-satellite-dish"></i><span class="source-ping"></span></span><span class="source-copy"><b>MoviesAPI</b><small>Full sync</small><em><i class="fa-solid fa-users-viewfinder"></i> Instant room control</em></span><span class="source-state"><i class="fa-solid fa-check"></i></span></button><button class="source-btn source-card source-vidzen" data-source="vidzen"><span class="source-orbit"><i class="fa-solid fa-wand-magic-sparkles"></i><span class="source-ping"></span></span><span class="source-copy"><b>VidZen</b><small>Full sync</small><em><i class="fa-solid fa-users-viewfinder"></i> Smooth room sync</em></span><span class="source-state"><i class="fa-solid fa-check"></i></span></button><button class="source-btn source-card source-vidscene" data-source="vidscene"><span class="source-orbit"><i class="fa-solid fa-clapperboard"></i><span class="source-ping"></span></span><span class="source-copy"><b>VidScene</b><small>Adaptive HLS • Full sync</small><em><i class="fa-solid fa-users-viewfinder"></i> Adaptive room sync</em></span><span class="source-state"><i class="fa-solid fa-check"></i></span></button></div><div class="source-tools"><button id="fullscreenBtn" class="btn primary"><i class="fa-solid fa-expand"></i> Full screen</button></div></section><section id="hostControls" class="panel host-controls" style="display:none;margin-bottom:14px"><div class="host-controls-head"><div><b><i class="fa-solid fa-gamepad"></i> Host Controls</b><div class="muted">Commands are sent immediately; a heartbeat corrects drift every 4 seconds.</div></div><strong id="hostCurrentTime">0:00</strong></div><div class="host-control-grid"><button class="btn primary" data-host-action="play">Play all</button><button class="btn" data-host-action="pause">Pause all</button><button class="btn" data-host-action="back30">-30s</button><button class="btn" data-host-action="back10">-10s</button><button class="btn" data-host-action="forward10">+10s</button><button class="btn" data-host-action="forward30">+30s</button><button class="btn success" data-host-action="sync">Sync now</button></div><form id="hostSeekForm" class="host-seek-form"><label>Jump everyone to exact time</label><div><input id="hostSeekInput" class="input" placeholder="42:17 or 1:12:30"><button class="btn primary" type="submit">Go</button></div></form></section><div id="controlsWrapper" class="panel" style="display:none;margin-bottom:14px"><div><b>Season</b><div id="seasonButtons" class="watch-bar"></div></div><div id="episodeSection" style="display:none"><b>Episode</b><div id="episodeButtons" class="watch-bar"></div></div></div><div id="playerWrap" class="player-wrap"><iframe id="player" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen></iframe></div></main><div id="toast" class="toast"></div><script src="js/auth.js"></script><script src="js/providers.js"></script><script src="js/watchtogether-player.js"></script><script src="js/tv.js"></script></body></html>
